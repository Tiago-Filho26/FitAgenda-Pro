<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitAgenda Pro | Início</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #121214; color: #e1e1e6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { background-color: #202024; border: 1px solid #323238; border-radius: 12px; }
        .btn-purple { background-color: #8257e5; color: white; border: none; transition: 0.2s; }
        .btn-purple:hover { background-color: #6833c5; color: white; transform: translateY(-2px); }
        .btn-outline-purple { border: 1px solid #8257e5; color: #8257e5; transition: 0.2s; }
        .btn-outline-purple:hover { background-color: #8257e5; color: white; }
        .text-purple { color: #8257e5; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="card card-custom shadow-lg p-5 text-center" style="width: 100%; max-width: 450px;">
        <div class="mb-4">
            <span class="bg-dark text-purple p-3 rounded-circle shadow-sm d-inline-block mb-3 border border-secondary">
                <i class="bi bi-activity fs-1"></i>
            </span>
            <h2 class="fw-bold text-white mb-1">FitAgenda Pro</h2>
            <p class="text-secondary small">Gestão inteligente de treinos e horários</p>
        </div>

        {% if session.get('id_cliente') %}
            <div>
                <h5 class="mb-4 text-light">Olá, <span class="text-purple fw-bold">{{ session.get('nome_cliente') }}</span>! 🏋️‍♂️</h5>
                <a href='/horarios' class="btn btn-purple btn-lg w-100 mb-3 shadow-sm"><i class="bi bi-calendar-check me-2"></i> Ver Agenda de Treinos</a>
                <a href='/meus_treinos' class="btn btn-outline-purple btn-lg w-100 mb-4 shadow-sm"><i class="bi bi-bag-check me-2"></i> Meus Treinos</a>
                <a href='/logout' class="btn btn-outline-danger w-100"><i class="bi bi-box-arrow-right me-2"></i> Sair da conta</a>
            </div>
        {% else %}
            <div class="d-grid gap-3 mt-2">
                <a href='/login' class="btn btn-purple btn-lg shadow-sm"><i class="bi bi-box-arrow-in-right me-2"></i> Fazer Login</a>
                <a href='/cadastro' class="btn btn-outline-light btn-lg"><i class="bi bi-person-plus me-2"></i> Criar uma Conta</a>
                <div class="my-2 border-top border-secondary"></div>
                <!-- O LINK ABAIXO FOI ALTERADO PARA /login_admin -->
                <a href='/login_admin' class="btn btn-dark btn-sm text-secondary"><i class="bi bi-gear me-1"></i> Painel do Personal (Admin)</a>
            </div>
        {% endif %}
    </div>

</body>
</html>
