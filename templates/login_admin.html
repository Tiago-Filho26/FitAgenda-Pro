<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito | FitAgenda Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #121214; color: #e1e1e6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { background-color: #202024; border: 1px solid #323238; border-radius: 12px; }
        .form-control { background-color: #121214 !important; border-color: #323238 !important; color: #fff !important; }
        .form-control:focus { border-color: #dc3545 !important; box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25) !important; }
        label { color: #a8a8b3 !important; font-weight: 500; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="card card-custom shadow-lg p-5" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <span class="text-danger fs-1 d-inline-block mb-2"><i class="bi bi-fingerprint"></i></span>
            <h3 class="fw-bold text-white mb-1">Acesso Restrito</h3>
            <p class="text-secondary small">Área exclusiva do Personal Trainer</p>
        </div>

        {% if mensagem_erro %}
            {{ mensagem_erro | safe }}
        {% endif %}

        <form method="POST">
            <div class="mb-4 text-start">
                <label class="form-label mb-1">Senha Mestra</label>
                <input type="password" name="senha_admin" class="form-control text-center fs-5 text-danger" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-danger w-100 fw-bold py-2 mb-3"><i class="bi bi-unlock-fill me-2"></i> Desbloquear Painel</button>
        </form>

        <div class="text-center mt-2 pt-3 border-top border-secondary">
            <a href="/" class="text-secondary text-decoration-none small"><i class="bi bi-arrow-left"></i> Voltar ao início</a>
        </div>
    </div>

</body>
</html>
